[project]
name = "plieai-tools"
version = "0.1.0"
description = "Konvertierungsscripts und Frontend-Tests für PlieAI_Web (sklearn → ONNX/JSON, NumPy → JSON)"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.4.0",
    "numpy>=1.24.0",
    "skl2onnx>=1.16.0",
    "onnxruntime>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "PIE", "RUF", "ANN", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
